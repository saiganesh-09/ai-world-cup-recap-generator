name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  # Dummy URL — only used at build/typecheck time; no DB is connected in CI.
  # Integration tests auto-skip when no database is reachable.
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/worldcup
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (integration tests skip without DB)
        run: npm test

      - name: Production build
        run: npm run build
